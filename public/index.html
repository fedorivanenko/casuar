<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Casuar Graph</title>
  <link rel="stylesheet" href="/graph-ui.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="mark">C</div>
        <div>
          <h1>Casuar Graph</h1>
          <p>Read-only knowledge graph visualizer for canonical Casuar objects</p>
        </div>
      </div>
      <div class="summary">
        <div class="status-pill" id="statusPill" data-mode="idle">Not connected</div>
        <div class="chip" id="summaryChip">0 nodes · 0 edges</div>
      </div>
    </header>

    <main class="shell">
      <section class="canvas-shell">
        <div class="toolbar">
          <button class="btn btn-secondary" id="reloadBtn" type="button">Reload graph</button>
          <button class="btn btn-secondary" id="disconnectBtn" type="button">Disconnect</button>
        </div>

        <svg id="graph" aria-label="Casuar knowledge graph"></svg>
        <div class="legend" id="legend"></div>

        <div class="state-layer" id="stateLayer">
          <div class="state-card" id="stateCard"></div>
        </div>
      </section>

      <aside class="inspector">
        <div class="eyebrow">Inspector</div>
        <div class="inspector-card" id="inspectorCard"></div>
      </aside>
    </main>
  </div>

  <script src="/graph-ui.js"></script>
</body>
</html>
